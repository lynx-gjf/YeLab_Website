name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: [ "1.3.2.1" ] 
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (With Base Path)
        run: |
          # 1. 强行指定 base 路径进行打包，让所有资源路径自动带上 /YeLab_Website/
          npm run build -- --base=/YeLab_Website/
          
          # 2. 添加 .nojekyll 防止 GitHub 忽略下划线文件
          touch dist/.nojekyll
          
          # 3. 复制一份 404.html，防止 Vue Router 刷新子页面报错
          cp dist/index.html dist/404.html
          
          # 4. (可选) 打印出构建后 HTML 里的资源路径，方便你在日志里检查对不对
          echo "--- 检查打包路径 ---"
          grep -o 'src="[^"]*"' dist/index.html | head -5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4