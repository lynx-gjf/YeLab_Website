name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: [ "1.3" ] # 监听 1.3 分支，提交代码时自动触发
  workflow_dispatch: # 支持在 Actions 页面手动点击运行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (With Base Path & MPA Config)
        run: |
          # 1. 使用 Node.js 脚本在云端动态注入多页应用配置
          # 这样你不需要修改本地的 vite.config.ts
          node -e "
            const fs = require('fs');
            let config = fs.readFileSync('vite.config.ts', 'utf-8');
            
            // 检查是否已经配置了多页入口，防止重复注入
            if (!config.includes('rollupOptions')) {
              if (config.includes('export default defineConfig(')) {
                config = config.replace(/export default defineConfig\(\{/, 'export default defineConfig({\n  build: {\n    rollupOptions: {\n      input: {\n        main: \"index.html\",\n        members: \"members.html\",\n        publications: \"publications.html\"\n      }\n    }\n  },');
              } else if (config.includes('export default {')) {
                config = config.replace(/export default \{/, 'export default {\n  build: {\n    rollupOptions: {\n      input: {\n        main: \"index.html\",\n        members: \"members.html\",\n        publications: \"publications.html\"\n      }\n    }\n  },');
              }
              fs.writeFileSync('vite.config.ts', config);
              console.log('✅ 已成功注入多页配置');
            } else {
              console.log('ℹ️ 已存在多页配置，跳过注入');
            }
          "

          # 2. 执行打包，并强制指定 base 路径
          npm run build -- --base=/YeLab_Website/
          
          # 3. 添加 .nojekyll 防止 GitHub 忽略下划线文件
          touch dist/.nojekyll
          
          # 4. 打印 dist 目录内容，确认多页 HTML 是否打包成功
          echo "--- 检查 dist 目录内容 ---"
          ls -la dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4